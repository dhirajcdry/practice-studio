<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="practice-studio" content="1">
<title>Practice Studio — NeetCode 250</title>
<link rel="icon" type="image/svg+xml" href="./img/favicon.svg">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/design.css">
<link rel="stylesheet" href="./css/lld.css">
<link rel="stylesheet" href="./css/interview.css">
<link rel="stylesheet" href="./css/workspace.css">
<link rel="stylesheet" href="./css/python-editor.css">
<link rel="stylesheet" href="./css/catalog.css">
<link rel="stylesheet" href="./css/problem-import.css">
<link rel="stylesheet" href="./css/roadmap.css">
<link rel="stylesheet" href="./css/viz.css">
<link rel="stylesheet" href="./css/coach-image.css">
<link rel="stylesheet" href="./css/themes.css">
<link rel="stylesheet" href="./css/progress-ui.css">
<link rel="stylesheet" href="./css/fx.css">
<link rel="stylesheet" href="./css/typing.css">
  <link rel="stylesheet" href="/css/submissions.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/report.css">
  <link rel="stylesheet" href="/css/context-inspector.css">
  <link rel="stylesheet" href="/css/coaching-instructions.css">
  <link rel="stylesheet" href="/css/practice.css">
  <link rel="stylesheet" href="/css/track-home.css">
  <link rel="stylesheet" href="/css/voice.css">
<link rel="stylesheet" href="./css/ui.css">
</head>
<body>

<header class="topbar">
  <a class="wordmark" href="#/" aria-label="Practice Studio — home">
    <span class="solid">Practice</span><span class="outline">Studio</span>
  </a>

  <!-- Three sections, one tap each. Explorer, Roadmap and Progress are views inside
       LeetCode and switch from its own header, not from here. -->
  <nav class="topnav" aria-label="Sections">
    <a class="btn btn--quiet navlink mono" id="navleetcode" href="#/" data-route="#/">LeetCode</a>
    <a class="btn btn--quiet navlink mono" href="#/design" data-route="#/design">System Design</a>
    <a class="btn btn--quiet navlink mono" href="#/lld" data-route="#/lld">LLD</a>
  </nav>

  <div class="searchwrap">
    <label class="searchbox" for="q">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <circle cx="5" cy="5" r="3.6" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 8 L11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input id="q" type="search" placeholder="Search title or pattern" autocomplete="off" spellcheck="false" aria-label="Search problems by title or pattern">
      <kbd>/</kbd>
    </label>
  </div>

  <div class="topmeta">
    <div class="recmount" id="rec-home" data-rec-home></div>
    <div class="streakmount" id="streakmount" hidden></div>
    <div class="setmount" id="setmount"></div>
    <div class="cell" id="srcCell" hidden><span class="srcdot" id="srcDot" data-state="boot"></span><span class="mono" id="srcLabel">Connecting</span></div>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main id="app" tabindex="-1"></main>

<aside id="drawer" class="drawer" hidden aria-hidden="true" aria-label="Reference panel"></aside>
<div id="scrim" class="scrim" hidden></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
