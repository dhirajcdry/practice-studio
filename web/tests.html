<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Studio — sanitizer &amp; markdown tests</title>
<link rel="stylesheet" href="./css/app.css">
<style>
  main{max-width:860px}
  .t{border-bottom:1px solid var(--hair-10);padding:7px 0;display:flex;gap:12px;align-items:baseline}
  .t:last-child{border-bottom:0}
  .t .v{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;flex:0 0 46px}
  .t.pass .v{color:var(--easy)}
  .t.fail .v{color:var(--hard);font-weight:700}
  .t .n{flex:1;font-size:14px}
  .t .d{font-family:var(--mono);font-size:11px;color:var(--ink-35);max-width:40ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grouphead{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-50);padding:18px 0 4px;border-bottom:1px solid var(--hair-20)}
</style>
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="./index.html"><span class="solid">Practice</span><span class="outline">Studio</span></a>
  <div class="searchwrap"></div>
  <div class="topmeta"><span class="mono dim">Self tests</span></div>
</header>
<main>
  <div class="viewhead"><div>
    <h1 id="headline">Running…</h1>
    <div class="sub">Allowlist sanitizer and escape-by-default markdown renderer. No library, no network.</div>
  </div></div>
  <section class="card" style="padding:2px 18px 14px"><div id="out"></div></section>
</main>
<script type="module" src="./js/tests.js"></script>
</body>
</html>
