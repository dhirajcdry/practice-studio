<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viz preview (temporary)</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/themes.css">
<link rel="stylesheet" href="./css/viz.css">
<style>
  body{padding:16px}
  #out{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
  #out .wide{grid-column:1 / -1;max-width:860px}
  .fail{color:var(--hard);font:12px var(--mono)}
</style>
</head>
<body>
<p class="mono dim" style="margin-bottom:12px">TEMPORARY — viz.js preview. Delete before commit.</p>
<div id="out"></div>
<script type="module">
import { parseViz, drawViz } from './js/viz.js';

const examples = [
  { type: 'graph', title: 'Flights as a directed graph', nodes: ['0', '1', '2', '3'],
    edges: [[0, 1, 100], [1, 2, 100], [2, 0, 100], [1, 3, 600], [2, 3, 200]],
    path: ['0', '1', '2', '3'], done: ['0'], labels: { 0: '0', 1: '100', 2: '200', 3: '400' } },
  { type: 'graph', title: 'Course schedule (DAG)', nodes: ['calc', 'linalg', 'ml', 'stats', 'dl', 'nlp'],
    edges: [['calc', 'linalg'], ['calc', 'stats'], ['linalg', 'ml'], ['stats', 'ml'], ['ml', 'dl'], ['dl', 'nlp'], ['calc', 'ml']],
    active: ['ml'], done: ['calc', 'linalg', 'stats'], dim: ['nlp'] },
  { type: 'graph', title: 'Undirected, antiparallel and self loop', directed: true,
    nodes: ['A', 'B', 'C', { id: 'D', label: 'D (dst)' }], edges: [['A', 'B', 3], ['B', 'A', 4], ['B', 'C'], ['C', 'D', 1], ['D', 'D', 'loop'], ['C', 'A']],
    bad: ['C'] },
  { type: 'array', title: 'Two pointers', values: [2, 7, 11, 15, 1, 8], pointers: { l: 0, r: 5 }, active: [0, 5], labels: { 0: 'min' } },
  { type: 'array', title: 'Sliding window', values: ['a', 'b', 'c', 'a', 'b', 'c', 'b', 'b'], window: [1, 3], pointers: { l: 1, r: 3, i: 3 }, dim: [0], bad: [3] },
  { type: 'array', title: 'Prefix sums', rows: [{ name: 'nums', values: [1, 2, 3, 4] }, { name: 'prefix', values: [0, 1, 3, 6, 10], done: [0, 1, 2], active: [3] }], pointers: { i: 3 } },
  { type: 'grid', title: 'Unique paths DP', cells: [[1, 1, 1, 1], [1, 2, 3, 4], [1, 3, null, 10]], rowLabels: ['r0', 'r1', 'r2'], colLabels: ['c0', 'c1', 'c2', 'c3'],
    arrows: [[[0, 1], [1, 1]], [[1, 0], [1, 1]]], path: [[0, 0], [1, 0], [1, 1], [1, 2], [1, 3], [2, 3]], active: [[1, 1]], bad: [[2, 2]], labels: { '2,3': 'ans' } },
  { type: 'tree', title: 'Level order', level: [3, 9, 20, null, null, 15, 7], active: [20], done: [9], labels: { 20: 'curr' } },
  { type: 'tree', title: 'Deeper tree', level: [1, 2, 3, 4, 5, null, 6, null, null, 7, 8], dim: [4] },
  { type: 'list', title: 'Reverse a list', values: [1, 2, 3, 4, 5], pointers: { prev: 0, curr: 1, next: 2 }, done: [0], active: [1] },
  { type: 'list', title: 'Cycle', values: [3, 2, 0, -4], cycleTo: 1, active: [1], labels: { 1: 'entry', 3: 'tail' } },
  { type: 'stack', title: 'Valid parentheses', items: ['(', '[', '{'], label: 'stack', active: [2] },
  { type: 'queue', title: 'BFS queue', items: ['A', 'B', 'C'], label: 'queue', active: [0] },
  { type: 'queue', title: 'Empty queue', items: [], label: 'queue' },
  { type: 'stack', title: 'Empty stack', items: [] },
  { type: 'array', title: 'Empty array', values: [] },
  { type: 'graph', title: 'XSS probe', nodes: ['<script>alert(1)<' + '/script>', '<img src=x onerror=alert(1)>'], edges: [[0, 1]] },
];

const dijkstra = {
  type: 'panels',
  title: 'Dijkstra on flights, at most k = 1 stop',
  panels: [
    { type: 'graph', title: 'Flights', nodes: ['0', '1', '2', '3'],
      edges: [[0, 1, 100], [1, 2, 100], [2, 0, 100], [1, 3, 600], [2, 3, 200]],
      labels: { 0: '0', 1: '∞', 2: '∞', 3: '∞' } },
    { type: 'queue', title: 'Min-heap', label: '(cost, node, flights)', items: ['(0, 0, 0)'] },
  ],
  frames: [
    { note: 'Start at node 0 with cost 0. Push (0, 0, 0) onto the heap.',
      panels: [{ active: ['0'], labels: { 0: '0', 1: '∞', 2: '∞', 3: '∞' } }, { items: ['(0, 0, 0)'], active: [0] }] },
    { note: 'Pop node 0. Relax 0→1 with cost 100; push (100, 1, 1).',
      panels: [{ done: ['0'], active: ['1'], path: ['0', '1'], labels: { 0: '0', 1: '100', 2: '∞', 3: '∞' } }, { items: ['(100, 1, 1)'], active: [0] }] },
    { note: 'Pop node 1 (1 flight taken). Relax 1→2 = 200 and 1→3 = 700, both as a 2nd flight.',
      panels: [{ done: ['0', '1'], active: ['2', '3'], path: ['0', '1', '3'], labels: { 0: '0', 1: '100', 2: '200', 3: '700' } }, { items: ['(200, 2, 2)', '(700, 3, 2)'], active: [0] }] },
    { note: 'Node 2 already took 2 flights; 2→3 would be a 3rd, more than k + 1. The answer is 700.',
      panels: [{ done: ['0', '1', '3'], dim: ['2'], path: ['0', '1', '3'], labels: { 0: '0', 1: '100', 2: '200', 3: '700' } }, { items: ['(700, 3, 2)'], done: [0] }] },
  ],
};

const out = document.getElementById('out');
const add = (spec, wide = false) => {
  const r = parseViz(JSON.stringify(spec));
  const fig = document.createElement('figure');
  fig.className = 'ill' + (wide ? ' wide' : '');
  const cap = document.createElement('figcaption');
  cap.className = 'mono dim';
  cap.textContent = r.ok ? (r.spec.title || 'Illustration') : 'Rejected';
  fig.append(cap);
  if (r.ok) fig.append(drawViz(r.spec));
  else { const p = document.createElement('p'); p.className = 'fail'; p.textContent = r.reason; fig.append(p); }
  out.append(fig);
};
add(dijkstra, true);
for (const e of examples) add(e);
</script>
</body>
</html>
