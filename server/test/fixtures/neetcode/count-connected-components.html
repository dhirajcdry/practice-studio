<!doctype html><html><head></head><body><app-root></app-root><script id="ng-state" type="application/json">{"problem-count-connected-components": {"id": "count-connected-components", "name": "Number of Connected Components in an Undirected Graph", "description": "You have an undirected graph of `n` nodes labeled from `0` to `n - 1`. You are given an integer `n` and an array `edges` where `edges[i] = [a\u1d62, b\u1d62]` indicates that there is an edge between `a\u1d62` and `b\u1d62` in the graph.\n\nReturn the number of connected components in the graph.\n\n<br>\n\n**Example 1:**\n\n![](https://imagedelivery.net/CLfkmk9Wzy8_9HRyug4EVA/d99cd414-340e-4c6f-083b-1f00fdf9eb00/public)\n\n```java\nInput:\nn = 5, edges = [[0,1],[1,2],[3,4]]\n\nOutput: 2\n```\n\n<br>\n\n**Example 2:**\n\n![](https://imagedelivery.net/CLfkmk9Wzy8_9HRyug4EVA/3f57f075-5114-473a-b198-b6da0da1cd00/public)\n\n```java\nInput:\nn = 5, edges = [[0,1],[1,2],[2,3],[3,4]]\n\nOutput: 1\n```\n\n<br>\n\n**Constraints:**\n* `1 <= n <= 2000`\n* `1 <= edges.length <= 5000`\n* `edges[i].length == 2`\n* `0 <= a\u1d62 < n`\n* `0 <= b\u1d62 < n`\n* `a\u1d62 != b\u1d62`\n* There are no repeated edges.\n\n\n<br>\n<br>\n<details class=\"hint-accordion\">\n    <summary>Topics</summary>\n    <div class=\"company-tags-container\">\n    <br>\n      <a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/depth-first-search\" target=\"_blank\">Depth-First Search</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/breadth-first-search\" target=\"_blank\">Breadth-First Search</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/union-find\" target=\"_blank\">Union Find</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/graph-theory\" target=\"_blank\">Graph Theory</a>\n    </div>\n</details>\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Recommended Time & Space Complexity</summary>\n    <p>\n    You should aim for a solution as good or better than <code>O(V + E)</code> time and <code>O(V + E)</code> space, where <code>V</code> is the number vertices and <code>E</code> is the number of edges in the graph.\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 1</summary>\n    <p>\n    Assume there are no edges initially, so we have <code>n</code> components, as there are that many nodes given. Now, we should add the given edges between the nodes. Can you think of an algorithm to add the edges between the nodes? Also, after adding an edge, how do you determine the number of components left?\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 2</summary>\n    <p>\n    We can use the Union-Find (DSU) algorithm to add the given edges. For simplicity, we use Union-Find by size, where we merge the smaller component into the larger one. The Union-Find algorithm inserts the edge only between two nodes from different components. It does not add the edge if the nodes are from the same component. How do you find the number of components after adding the edges? For example, consider that nodes <code>0</code> and <code>1</code> are not connected, so there are initially two components. After adding an edge between these nodes, they become part of the same component, leaving us with one component.\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 3</summary>\n    <p>\n    We create an object of the DSU and initialize the result variable <code>res = n</code>, which indicates that there are <code>n</code> components initially. We then iterate through the given edges. For each edge, we attempt to connect the nodes using the union function of the DSU. If the union is successful, we decrement <code>res</code>; otherwise, we continue. Finally, we return <code>res</code> as the number of components.\n    </p>\n</details>\n\n\n<br>\n<details class=\"company-tags-accordion\">\n    <summary>Company Tags</summary>\n    <p>Please upgrade to <a href=\"https://neetcode.io/pro\" target=\"_blank\">NeetCode Pro</a> to view company tags.</p>\n</details>", "difficulty": "Medium", "free": true, "tag": "NeetCode150", "leetcodePremium": true, "test_case_type": "function", "custom_test_cases": ["n=5\nedges=[[0,1],[1,2],[3,4]]", "n=5\nedges=[[0,1],[1,2],[2,3],[3,4]]"], "starterCode": {"python": "class Solution:\n    def countComponents(self, n: int, edges: List[List[int]]) -> int:\n        "}}}</script></body></html>
