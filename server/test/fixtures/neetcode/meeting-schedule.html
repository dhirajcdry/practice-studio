<!doctype html><html><head></head><body><app-root></app-root><script id="ng-state" type="application/json">{"problem-meeting-schedule": {"id": "meeting-schedule", "name": "Meeting Rooms", "description": "Given an array of meeting time interval objects consisting of start and end times `[[start_1,end_1],[start_2,end_2],...] (start_i < end_i)`, determine if a person could add all meetings to their schedule without any conflicts. The intervals may be provided in any order.\n\n**Note:** (0,8),(8,10) is not considered a conflict at 8\n\n**Example 1:**\n\n```java\nInput: intervals = [(0,30),(5,10),(15,20)]\n\nOutput: false\n```\n\nExplanation:\n* `(0,30)` and `(5,10)` will conflict\n* `(0,30)` and `(15,20)` will conflict\n\n**Example 2:**\n\n```java\nInput: intervals = [(5,8),(9,15)]\n\nOutput: true\n```\n\n\n**Constraints:**\n* `0 <= intervals.length <= 500`\n* `0 <= intervals[i].start < intervals[i].end <= 1,000,000`\n\n\n<br>\n<br>\n<details class=\"hint-accordion\">\n    <summary>Topics</summary>\n    <div class=\"company-tags-container\">\n    <br>\n      <a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/array\" target=\"_blank\">Array</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/sorting\" target=\"_blank\">Sorting</a>\n    </div>\n</details>\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Recommended Time & Space Complexity</summary>\n    <p>\n    You should aim for a solution with <code>O(nlogn)</code> time and <code>O(n)</code> space, where <code>n</code> is the size of the input array.\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 1</summary>\n    <p>\n    If two intervals are sorted in ascending order by their start values, they overlap if the start value of the second interval is less than the end value of the first interval. And these are called overlapping intervals.\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 2</summary>\n    <p>\n    A brute force approach would be to check every pair of intervals and return <code>false</code> if any overlap is found. This would be an <code>O(n^2)</code> solution. Can you think of a better way? Maybe you should visualize the given intervals as line segments.\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 3</summary>\n    <p>\n    We should sort the given intervals based on their start values, as this makes it easier to check for overlaps by comparing adjacent intervals. We then iterate through the intervals from left to right and return <code>false</code> if any adjacent intervals overlap.\n    </p>\n</details>\n\n\n<br>\n<details class=\"company-tags-accordion\">\n    <summary>Company Tags</summary>\n    <p>Please upgrade to <a href=\"https://neetcode.io/pro\" target=\"_blank\">NeetCode Pro</a> to view company tags.</p>\n</details>", "difficulty": "Easy", "free": true, "tag": "NeetCode150", "leetcodePremium": true, "test_case_type": "function", "custom_test_cases": ["intervals=[(0,30),(5,10),(15,20)]", "intervals=[(5,8),(9,15)]"], "starterCode": {"python": "\"\"\"\nDefinition of Interval:\nclass Interval(object):\n    def __init__(self, start, end):\n        self.start = start\n        self.end = end\n\"\"\"\n\nclass Solution:\n    def canAttendMeetings(self, intervals: List[Interval]) -> bool:\n"}}}</script></body></html>
