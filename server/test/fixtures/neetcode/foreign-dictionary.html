<!doctype html><html><head></head><body><app-root></app-root><script id="ng-state" type="application/json">{"problem-foreign-dictionary": {"id": "foreign-dictionary", "name": "Alien Dictionary", "description": "There is a new alien language that uses the English alphabet, but the order of the letters is unknown.\n\nYou are given a list of strings `words` from the alien language's dictionary. It is claimed that the strings in `words` are sorted lexicographically by the rules of this new language.\n\nIf this claim is incorrect, and the given arrangement of strings in `words` cannot correspond to any order of letters, return `\"\"`.\n\nOtherwise, return a string of the unique letters in the new alien language sorted in lexicographically increasing order by the new language's rules. If there are multiple solutions, return **any** of them.\n\nA string `a` is lexicographically smaller than a string `b` if either of the following is true:\n* The first letter where they differ is smaller in `a` than in `b`.\n* `a` is a prefix of `b` *and* `a.length < b.length`.\n\n<br>\n\n**Example 1:**\n\n```java\nInput: words = [\"z\",\"o\"]\n\nOutput: \"zo\"\n```\n\nExplanation:\nFrom `\"z\"` and `\"o\"`, we know `'z' < 'o'`, so return `\"zo\"`.\n\n<br>\n\n**Example 2:**\n\n```java\nInput: words = [\"hrn\",\"hrf\",\"er\",\"enn\",\"rfnn\"]\n\nOutput: \"hernf\"\n```\n\nExplanation:\n* from `\"hrn\"` and `\"hrf\"`, we know `'n' < 'f'`\n* from `\"hrf\"` and `\"er\"`, we know `'h' < 'e'`\n* from `\"er\"` and `\"enn\"`, we know `'r' < 'n'`\n* from `\"enn\"` and `\"rfnn\"` we know `'e' < 'r'`\n* so one possible solution is `\"hernf\"`\n\n<br>\n\n**Example 3:**\n\n```java\nInput: words = [\"abc\",\"ab\"]\n\nOutput: \"\"\n```\n\nExplanation:\nThe second word is a prefix of the first word, but the first word appears before the second. This is impossible in a valid lexicographical ordering, so return `\"\"`.\n\n<br>\n\n**Constraints:**\n* `1 <= words.length <= 100`\n* `1 <= words[i].length <= 100`\n* `words[i]` consists of only lowercase English letters.\n\n\n<br>\n<br>\n<details class=\"hint-accordion\">\n    <summary>Topics</summary>\n    <div class=\"company-tags-container\">\n    <br>\n      <a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/array\" target=\"_blank\">Array</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/string\" target=\"_blank\">String</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/depth-first-search\" target=\"_blank\">Depth-First Search</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/breadth-first-search\" target=\"_blank\">Breadth-First Search</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/graph-theory\" target=\"_blank\">Graph Theory</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/topological-sort\" target=\"_blank\">Topological Sort</a>\n    </div>\n</details>\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Recommended Time & Space Complexity</summary>\n    <p>\n    You should aim for a solution with <code>O(N + V + E)</code> time and <code>O(V + E)</code> space, where <code>N</code> is the sum of the lengths of all the strings, <code>V</code> is the number of unique characters (vertices), and <code>E</code> is the number of edges.\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 1</summary>\n    <p>\n    Can you think of this as a graph problem? Characters from <code>a</code> through <code>z</code> are nodes. What could the edges represent here? How can you create edges from the given words? Perhaps you should try comparing two adjacent words.\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 2</summary>\n    <p>\n    The relative ordering of the characters can be treated as edges. For example, consider the words ordered as <code>[\"ape\", \"apple\"]</code>. <code>\"ape\"</code> comes before <code>\"apple\"</code>, which indicates that <code>'e'</code> is a predecessor of <code>'p'</code>. Therefore, there is a directed edge <code>e -> p</code>, and this dependency should be valid across all the words. In this way, we can build an adjacency list by comparing adjacent words. Can you think of an algorithm that is suitable to find a valid ordering?\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 3</summary>\n    <p>\n    We can use Topological Sort to ensure every node appears after its predecessor. Using DFS, we traverse the graph built from the adjacency list. A visited map tracks nodes in the current DFS path: <code>False</code> means not in the path, and <code>True</code> means in the path. If any DFS call returns <code>True</code>, it indicates a cycle and we return immediately. How do we extract the ordering from this DFS?  \n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 4</summary>\n    <p>\n    When we visit a node and its children and don't find a cycle, we mark the node as <code>False</code> in the map and append it to the result, treating this as a post-order traversal. If we find a cycle, we return an empty string; otherwise, we return the result list.\n    </p>\n</details>\n\n\n<br>\n<details class=\"company-tags-accordion\">\n    <summary>Company Tags</summary>\n    <p>Please upgrade to <a href=\"https://neetcode.io/pro\" target=\"_blank\">NeetCode Pro</a> to view company tags.</p>\n</details>", "difficulty": "Hard", "free": true, "tag": "NeetCode150", "leetcodePremium": true, "test_case_type": "function", "custom_test_cases": ["words=[\"z\",\"o\"]", "words=[\"hrn\",\"hrf\",\"er\",\"enn\",\"rfnn\"]", "words=[\"abc\",\"ab\"]"], "starterCode": {"python": "class Solution:\n    def foreignDictionary(self, words: List[str]) -> str:\n        "}}}</script></body></html>
