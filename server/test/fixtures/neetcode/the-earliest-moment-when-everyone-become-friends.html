<!doctype html><html><head></head><body><app-root></app-root><script id="ng-state" type="application/json">{"problem-the-earliest-moment-when-everyone-become-friends": {"id": "the-earliest-moment-when-everyone-become-friends", "name": "The Earliest Moment When Everyone Become Friends", "description": "There are `n` people in a social group labeled from `0` to `n - 1`. You are given an array `logs` where `logs[i] = [timestamp\u1d62, x\u1d62, y\u1d62]` indicates that `x\u1d62` and `y\u1d62` will be friends at the time `timestamp\u1d62`.\n\nFriendship is **symmetric**. That means if `a` is friends with `b`, then `b` is friends with `a`. Also, person `a` is acquainted with a person `b` if `a` is friends with `b`, or `a` is a friend of someone acquainted with `b`.\n\nReturn *the earliest time for which every person became acquainted with every other person*. If there is no such earliest time, return `-1`.\n\n**Example 1:**\n\n```java\nInput: logs = [[20190101,0,1],[20190104,3,4],[20190107,2,3],[20190211,1,5],[20190224,2,4],[20190301,0,3],[20190312,1,2],[20190322,4,5]], n = 6\n\nOutput: 20190301\n```\n\nExplanation: The first event occurs at timestamp = `20190101`, and after `0` and `1` become friends, we have the following friendship groups `[0,1]`, `[2]`, `[3]`, `[4]`, `[5]`.\nThe second event occurs at timestamp = `20190104`, and after `3` and `4` become friends, we have the following friendship groups `[0,1]`, `[2]`, `[3,4]`, `[5]`.\nThe third event occurs at timestamp = `20190107`, and after `2` and `3` become friends, we have the following friendship groups `[0,1]`, `[2,3,4]`, `[5]`.\nThe fourth event occurs at timestamp = `20190211`, and after `1` and `5` become friends, we have the following friendship groups `[0,1,5]`, `[2,3,4]`.\nThe fifth event occurs at timestamp = `20190224`, and after `2` and `4` are already friends, nothing happens.\nThe sixth event occurs at timestamp = `20190301`, and after `0` and `3` become friends, we all become friends.\n\n**Example 2:**\n\n```java\nInput: logs = [[0,2,0],[1,0,1],[3,0,3],[4,1,2],[7,3,1]], n = 4\n\nOutput: 3\n```\n\nExplanation: At timestamp = `3`, all the persons (i.e., `0`, `1`, `2`, and `3`) become friends.\n\n<br>\n\n**Constraints:**\n* `2 <= n <= 100`\n* `1 <= logs.length <= 10\u2074`\n* `logs[i].length == 3`\n* `0 <= timestamp\u1d62 <= 10\u2079`\n* `0 <= x\u1d62, y\u1d62 <= n - 1`\n* `x\u1d62 != y\u1d62`\n* All the values `timestamp\u1d62` are **unique**.\n* All the pairs `(x\u1d62, y\u1d62)` occur at most one time in the input.\n\n", "difficulty": "Medium", "free": false, "tag": "NeetCode150", "message": "You must be a pro member to view this problem."}}</script></body></html>
