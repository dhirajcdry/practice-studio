<!doctype html><html><head></head><body><app-root></app-root><script id="ng-state" type="application/json">{"problem-valid-tree": {"id": "valid-tree", "name": "Graph Valid Tree", "description": "Given `n` nodes labeled from `0` to `n - 1` and a list of **undirected** edges (each edge is a pair of nodes), write a function to check whether these edges make up a valid tree.\n\n<br>\n\n**Example 1:**\n\n![](https://imagedelivery.net/CLfkmk9Wzy8_9HRyug4EVA/cf8b3035-344d-455a-fcbe-cbe9d6121a00/public)\n\n```java\nInput: n = 5, edges = [[0,1],[0,2],[0,3],[1,4]]\n\nOutput: true\n```\n\n<br>\n\n**Example 2:**\n\n![](https://imagedelivery.net/CLfkmk9Wzy8_9HRyug4EVA/09155553-b851-4439-203e-8a8064ea9000/public)\n\n```java\nInput: n = 5, edges = [[0,1],[1,2],[2,3],[1,3],[1,4]]\n\nOutput: false\n```\n\n<br>\n\n**Note:**\n* You can assume that no duplicate edges will appear in edges. Since all edges are `undirected`, `[0, 1]` is the same as `[1, 0]` and thus will not appear together in edges.\n\n<br>\n\n**Constraints:**\n* `1 <= n <= 2000`\n* `0 <= edges.length <= 5000`\n* `edges[i].length == 2`\n* `0 <= a_i, b_i < n`\n* `a_i != b_i`\n* There are no self-loops or repeated edges.\n\n\n<br>\n<br>\n<details class=\"hint-accordion\">\n    <summary>Topics</summary>\n    <div class=\"company-tags-container\">\n    <br>\n      <a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/depth-first-search\" target=\"_blank\">Depth-First Search</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/breadth-first-search\" target=\"_blank\">Breadth-First Search</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/union-find\" target=\"_blank\">Union Find</a>\n<a class=\"button company-tag-reveal-btn\" href=\"/practice/problem-list/graph\" target=\"_blank\">Graph</a>\n    </div>\n</details>\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Recommended Time & Space Complexity</summary>\n    <p>\n    You should aim for a solution as good or better than <code>O(V + E)</code> time and <code>O(V + E)</code> space, where <code>V</code> is the number vertices and <code>E</code> is the number of edges in the graph.\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 1</summary>\n    <p>\n    According to the definition of a tree, a tree is an undirected graph with no cycles, all the nodes are connected as one component, and any two nodes have exactly one path. Can you think of a recursive algorithm to detect a cycle in the given graph and ensure it is a tree?\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 2</summary>\n    <p>\n    We can use the Depth First Search (DFS) algorithm to detect a cycle in the graph. Since a tree has only one component, we can start the DFS from any node, say node <code>0</code>. During the traversal, we recursively visit its neighbors (children). If we encounter any already visited node that is not the parent of the current node, we return false as it indicates a cycle. How would you implement this?\n    </p>\n</details>\n\n<br>\n<details class=\"hint-accordion\">  \n    <summary>Hint 3</summary>\n    <p>\n    We start DFS from node <code>0</code>, assuming <code>-1</code> as its parent. We initialize a hash set <code>visit</code> to track the visited nodes in the graph. During the DFS, we first check if the current node is already in <code>visit</code>. If it is, we return false, detecting a cycle. Otherwise, we mark the node as visited and perform DFS on its neighbors, skipping the parent node to avoid revisiting it. After all DFS calls, if we have visited all nodes, we return true, as the graph is connected. Otherwise, we return false because a tree must contain all nodes.\n    </p>\n</details>\n\n\n<br>\n<details class=\"company-tags-accordion\">\n    <summary>Company Tags</summary>\n    <p>Please upgrade to <a href=\"https://neetcode.io/pro\" target=\"_blank\">NeetCode Pro</a> to view company tags.</p>\n</details>", "difficulty": "Medium", "free": true, "tag": "NeetCode150", "leetcodePremium": true, "test_case_type": "function", "custom_test_cases": ["n=5\nedges=[[0,1],[0,2],[0,3],[1,4]]", "n=5\nedges=[[0,1],[1,2],[2,3],[1,3],[1,4]]"], "starterCode": {"python": "class Solution:\n    def validTree(self, n: int, edges: List[List[int]]) -> bool:\n        "}}}</script></body></html>
