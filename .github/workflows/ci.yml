name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Fetch the reference revision used by the committed index
        run: |
          reference_commit="$(node -p 'JSON.parse(require("node:fs").readFileSync("data/solutions-index.json", "utf8")).source.commit')"
          git clone --depth 1 --no-checkout https://github.com/neetcode-gh/leetcode.git vendor/neetcode-solutions
          git -C vendor/neetcode-solutions fetch --depth 1 origin "$reference_commit"
          git -C vendor/neetcode-solutions checkout --detach FETCH_HEAD

      - name: Run unit and integration tests
        run: npm test
