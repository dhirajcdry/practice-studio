name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch the reference revision used by the committed index
        run: |
          reference_commit="$(node -p 'JSON.parse(require("node:fs").readFileSync("data/solutions-index.json", "utf8")).source.commit')"
          git clone --depth 1 --no-checkout https://github.com/neetcode-gh/leetcode.git vendor/neetcode-solutions
          git -C vendor/neetcode-solutions fetch --depth 1 origin "$reference_commit"
          git -C vendor/neetcode-solutions checkout --detach FETCH_HEAD

      - name: Run unit and integration tests
        run: npm test
